name: Release

# Runs when a release PR (dev → main, titled "release: vX.Y.Z") is squash-merged.
# Tags the commit, creates the GitHub Release, and back-merges main into dev so the
# two branches never diverge. No bot needed: GITHUB_TOKEN is enough because dev is
# not protected against the workflow's own push.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read version from commit subject
        id: version
        env:
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          first_line=$(printf '%s' "$SUBJECT" | head -n1)
          version=$(printf '%s' "$first_line" | sed -nE 's/^release: (v[0-9]+\.[0-9]+\.[0-9]+)( \(#[0-9]+\))?$/\1/p')
          if [ -z "$version" ]; then
            echo "::error::main commit subject must be 'release: vX.Y.Z' (got: '$first_line')"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: '.nvmrc'

      # A release PR merged with GitHub's web button gets a "Co-authored-by:" trailer for every
      # author in dev's history (dev's older commits are not reachable from main, so every release
      # PR lists them all). Recreate the commit with the PR title and body only: same tree, same
      # parent, same author. The push uses GITHUB_TOKEN, so it starts no workflow (no loop), and
      # --force-with-lease refuses if main moved meanwhile. See docs/branching-and-releases.md.
      - name: Strip co-author trailers from the release commit
        id: commit
        run: |
          message=$(git log -1 --format=%B "$GITHUB_SHA")
          clean=$(printf '%s\n' "$message" | node scripts/clean-release-message.mjs)
          if [ "$clean" = "$(printf '%s\n' "$message" | git stripspace)" ]; then
            echo "Release commit message is already clean."
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GIT_AUTHOR_NAME="$(git log -1 --format=%an "$GITHUB_SHA")"
          export GIT_AUTHOR_EMAIL="$(git log -1 --format=%ae "$GITHUB_SHA")"
          export GIT_AUTHOR_DATE="$(git log -1 --format=%aD "$GITHUB_SHA")"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_COMMITTER_DATE="$(git log -1 --format=%cD "$GITHUB_SHA")"
          sha=$(printf '%s\n' "$clean" | git commit-tree "$GITHUB_SHA^{tree}" -p "$GITHUB_SHA^")
          git push --force-with-lease="main:$GITHUB_SHA" origin "$sha:refs/heads/main"
          git fetch origin main
          echo "Replaced $GITHUB_SHA with $sha (same tree, no co-author trailers)."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists, skipping."
            exit 0
          fi
          gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes

      - name: Back-merge main into dev
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout dev
          # main's squash commit has the same content dev already has; "-s ours"
          # only records main as an ancestor so the next release PR is clean.
          git merge -s ours --no-edit -m "chore: back-merge $VERSION into dev" origin/main
          git push origin dev
