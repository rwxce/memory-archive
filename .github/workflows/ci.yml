name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  # No telemetry from the Next.js toolchain (docs/privacy.md).
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # minimumReleaseAge (pnpm-workspace.yaml) is enforced here too.
      - run: pnpm install --frozen-lockfile

      # Generated agent config (AGENTS.md, CLAUDE.md, .claude/, ...) must match .rulesync/.
      - run: pnpm rulesync:check

      - run: pnpm check
