name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

env:
  # No telemetry from the Next.js toolchain (docs/privacy.md).
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      # minimumReleaseAge (pnpm-workspace.yaml) is enforced here too.
      - run: pnpm install --frozen-lockfile

      # Generated agent config (AGENTS.md, CLAUDE.md, .claude/, ...) must match .rulesync/.
      - run: pnpm rulesync:check

      - run: pnpm check

  # Browser end-to-end checks of the built PWA (Phase 3 flows) at 390 px and
  # 1440 px, in the runner's preinstalled Google Chrome (no browser download).
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
