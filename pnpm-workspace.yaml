# Supply-chain safety: never install a version published less than 7 days ago.
# Gives the community time to detect and pull a malicious release before it
# reaches node_modules. Value in minutes (10080 = 7 days).
minimumReleaseAge: 10080

# Security overrides: exact patched versions of vulnerable transitive deps.
# Always an exact version (never a range) and published ≥7 days ago, consistent
# with minimumReleaseAge.
overrides:
  esbuild: 0.28.2

# Install scripts allowlist: only these packages may run lifecycle scripts.
allowBuilds:
  esbuild: true
  # tldjs (via rulesync → fastmcp → mcp-proxy → pipenet): its postinstall only
  # refreshes the TLD list from the network when explicitly opted in. Not needed.
  tldjs: false
  # @swc/core and @parcel/watcher (via next-intl's optional message extractor,
  # and tsup): their install scripts only download/select a native binary that
  # the platform-specific optional dependencies already provide. Not needed.
  '@swc/core': false
  '@parcel/watcher': false
  # unrs-resolver (via eslint-import-resolver-typescript / import-x): its
  # postinstall only re-checks the native binding that the platform-specific
  # optional dependency already installs. Not needed.
  unrs-resolver: false
